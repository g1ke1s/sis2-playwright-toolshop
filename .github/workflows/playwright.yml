name: Playwright Tests

on:
  push:              # every push to every branch
  pull_request:      # every PR
  workflow_dispatch: # manual runs for the before/after timing
    inputs:
      shards:
        description: 'Number of shards (1 = "before", 4 = "after")'
        type: choice
        options: ['4', '1']
        default: '4'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # push / pull_request → inputs.shards is empty → 4 shards
        shardIndex: ${{ fromJSON(inputs.shards == '1' && '[1]' || '[1, 2, 3, 4]') }}
        shardTotal: ${{ fromJSON(inputs.shards == '1' && '[1]' || '[4]') }}
    env:
      # The public site's Cloudflare bot check blocks GitHub runners,
      # so every shard tests its own local Toolshop (see ci/toolshop.compose.yml).
      BASE_URL: http://localhost:4200
      API_URL: http://localhost:8091
    steps:
      - uses: actions/checkout@v4

      - name: Start the Toolshop (Docker)    # boots in the background while npm/browsers install
        run: docker compose -f ci/toolshop.compose.yml up -d --quiet-pull

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm                 # caches ~/.npm keyed on package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts  # skip postinstall: browsers are installed in the next step

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Type-check
        run: npx tsc -p .

      - name: Wait for the Toolshop and seed the database
        run: bash ci/wait-toolshop.sh

      - name: Run Playwright tests
        run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report
          retention-days: 1          # intermediate file

      - name: Upload traces and JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shardIndex }}
          path: |
            test-results/
            reports/
          retention-days: 14

  merge-reports:
    name: Merge reports
    if: ${{ !cancelled() }}
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts  # merging needs no browser

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into HTML + JUnit
        run: npx playwright merge-reports --config merge.config.ts ./all-blob-reports

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - name: Upload merged JUnit
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: reports/junit-merged.xml
          retention-days: 14
